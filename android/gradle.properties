# 注意：不要加入 -XX:+HeapDumpOnOutOfMemoryError，OOM 時會在 android/ 產生
# 1.7 GB 以上的 .hprof，曾導致 C 槽空間不足、後續建置失敗（QA B02）。
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
# 在記憶體有限的開發機上，讓 Kotlin 在 Gradle 程序內編譯，避免額外的 Kotlin daemon。
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.enableJetifier=true
