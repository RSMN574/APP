plugins {
    id "com.android.application"
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics' // Firebase
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace = "com.rsmn574.app"

    // ✅ 建議使用 compileSdk = 35（更穩定），除非您確定需要 36
    compileSdk = 36  // 或 36

    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true

        // ✅ 升級到 Java 17（Gradle 8.x 建議）
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        // ✅ 升級到 Java 17
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId = "com.rsmn574.app"
        minSdkVersion = flutter.minSdkVersion  // 明確指定最低版本
        targetSdk = 36  // 明確指定目標版本
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
            // ✅ 開啟混淆（可選）
            minifyEnabled true
            shrinkResources true

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // ✅ Firebase BOM（使用最新穩定版本）
    implementation platform('com.google.firebase:firebase-bom:34.15.0')
    implementation 'com.google.firebase:firebase-messaging'

    // ✅ Desugaring 支援（Java 8+ API）
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
